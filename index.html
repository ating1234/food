<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>食品營養成分 - 台灣食品營養成分資料庫</title>
  <meta name="description" content="🥗 快速查詢 2,180 種台灣在地食品、104 項完整營養分析，支援自訂攝取量精確換算與食品對比，資料來源：衛生福利部食品藥物管理署（TFDA）第 20.5 版。" />
  
  <!-- Open Graph / Facebook / LINE -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="食品營養成分" />
  <meta property="og:title" content="🥗 食品營養成分 - 台灣食品營養成分資料庫" />
  <meta property="og:description" content="收錄 2,180 種台灣在地食品、104 項營養分析、自訂攝取量換算與食品比較。資料來源：衛福部食藥署 第 20.5 版。" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="🥗 食品營養成分 - 台灣食品營養成分資料庫" />
  <meta name="twitter:description" content="收錄 2,180 種台灣在地食品、104 項營養分析、自訂攝取量換算與食品比較。" />
  
  <!-- Favicon (Emoji SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">🥗</span>
      <div class="logo-text-group">
        <span class="logo-text">食品營養成分</span>
        <span class="logo-sub">Taiwan Food Nutrition Database</span>
      </div>
    </div>
    <div class="header-right">
      <div class="header-tags">
        <span class="htag">🔍 2,180 種食品</span>
        <span class="htag">📊 104 項分析</span>
        <span class="htag">⚖️ 自訂攝取量換算</span>
        <span class="htag htag-accent">❤️ 收藏 &amp; 比較</span>
      </div>
      <button class="header-share-btn" id="btnHeaderShare" title="分享網站">📤 分享</button>
      <div class="header-meta">資料來源：衛福部食藥署 第 20.5 版</div>
    </div>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">食品分類</div>
    <ul class="category-list" id="categoryList"></ul>
  </aside>

  <main class="main-content">
    <!-- SEARCH -->
    <section class="search-section">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input"
          placeholder="搜尋食品名稱、俗名、英文名…" autocomplete="off" />
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>
      <div class="search-hint" id="searchHint">載入中，請稍候…</div>
    </section>

    <!-- 手機 / 平板橫向滑動分類列 -->
    <div class="mobile-cat-bar" id="mobileCatBar"></div>

    <!-- TABS -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="search">🔍 搜尋結果</button>
      <button class="tab-btn" data-tab="compare">📊 食品比較
        <span class="compare-badge" id="compareBadge" style="display:none">0</span>
      </button>
    </div>

    <!-- TAB: SEARCH -->
    <section class="tab-panel active" id="tab-search">

      <!-- 收藏工具列（僅在「我的收藏」分類時顯示）-->
      <div class="fav-toolbar" id="favToolbar" style="display:none">
        <span class="ftb-info" id="favToolbarInfo"></span>
        <div class="ftb-actions">
          <button class="ftbtn" id="btnExport">📤 匯出收藏</button>
          <button class="ftbtn" id="btnImportTrigger">📥 匯入收藏</button>
          <button class="ftbtn ftbtn-accent" id="btnShare">🔗 分享連結</button>
          <input type="file" id="importFileInput" accept=".json" style="display:none" />
        </div>
      </div>

      <div class="food-grid" id="foodGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">🥬</div>
        <div>目前沒有收藏的食品</div>
        <div style="font-size:.8rem;color:var(--gray-300);margin-top:6px">點擊食品卡片上的 🤍 即可收藏</div>
      </div>
    </section>


    <!-- TAB: COMPARE -->
    <section class="tab-panel" id="tab-compare">
      <div class="compare-hint" id="compareHint">
        <div style="font-size:2rem;margin-bottom:12px">📊</div>
        <div style="font-weight:600;margin-bottom:6px">選擇食品進行比較</div>
        <div style="font-size:.85rem;color:var(--gray-400)">在搜尋結果中點擊「＋ 比較」，最多可比較 3 種食品</div>
      </div>
      <div class="compare-table-wrap" id="compareTableWrap" style="display:none">
        <div class="compare-controls">
          <label class="compare-label">顯示項目：</label>
          <select id="compareCategory" class="compare-select"></select>
          <button class="btn-clear-compare" id="clearCompare">🗑 清除全部</button>
        </div>
        <div class="compare-scroll">
          <table class="compare-table" id="compareTable"></table>
        </div>
      </div>
    </section>

    <!-- 全站頁尾（手機與桌機皆能清楚查閱資料來源） -->
    <footer class="site-footer">
      <div class="footer-source">
        <span class="source-badge">官方資料</span>
        <span>資料來源：衛生福利部食品藥物管理署（TFDA）食品營養成分資料庫 第 20.5 版</span>
      </div>
    </footer>
  </main>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <h2 class="modal-food-name" id="modalFoodName"></h2>
        <span class="modal-food-en"   id="modalFoodEn"></span>
        <span class="modal-food-alias" id="modalFoodAlias"></span>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>

    <!-- 計算器 -->
    <div class="calc-bar">
      <span class="calc-label">攝取量計算</span>
      <div class="calc-controls">
        <button class="calc-mode-btn active" data-mode="100g">每 100g</button>
        <button class="calc-mode-btn" data-mode="custom">自訂克數</button>
      </div>
      <div class="calc-input-wrap" id="calcInputWrap" style="display:none">
        <input type="number" id="calcGrams" class="calc-input" value="100" min="1" max="9999" />
        <span class="calc-unit">克</span>
      </div>
    </div>

    <!-- 分類標籤 -->
    <div class="nutrient-tabs" id="nutrientTabs"></div>

    <!-- 營養成分表 -->
    <div class="nutrient-content" id="nutrientContent"></div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-fav" id="btnFavModal">🤍 收藏</button>
      <button class="btn-compare-add" id="btnCompareAdd">➕ 加入比較</button>
    </div>
  </div>
</div>

<!-- 底部比較列 -->
<div class="compare-bar" id="compareBar">
  <div class="cbar-label">📊 比較清單</div>
  <div class="cbar-foods" id="compareBarList"></div>
  <div class="cbar-actions">
    <button class="cbar-btn primary" id="compareBarOpen">開始比較 →</button>
    <button class="cbar-btn ghost"   id="compareBarClear">清除</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
